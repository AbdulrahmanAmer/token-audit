name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Manifests are valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'));JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
      - name: Plugin and marketplace versions/names agree
        run: node scripts/check-manifests.mjs
      - name: Syntax
        run: node --check scripts/audit.mjs && node --check scripts/test/run-tests.mjs
      - name: Tests (privacy invariant + correctness)
        run: node scripts/test/run-tests.mjs
      - name: Installer is valid shell
        run: bash -n install.sh
