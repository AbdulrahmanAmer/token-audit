name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because both defects found before v0.1.0 was tagged were
        # Windows-only and both failed with exit code 0 and a wrong answer. A ubuntu-only
        # pipeline was green for all of it.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Manifests are valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'));JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
      - name: Manifests, skills, README and referenced scripts agree
        run: node scripts/check-manifests.mjs
      - name: Syntax
        run: node --check scripts/audit.mjs && node --check scripts/quiet.mjs && node --check scripts/quiet-tests.mjs && node --check scripts/code-index.mjs && node --check scripts/code-map.mjs && node --check scripts/code-map-learn.mjs
      - name: The committed code index is not stale
        # Derived, never authored. Without this the fact table drifts and becomes a confident
        # liar — worse than absent, because people stop double-checking a table that has been
        # right before.
        run: node scripts/code-index.mjs --check
      - name: Tests (privacy invariant + correctness + quiet-tests)
        run: node scripts/test/run-all.mjs
      - name: Installer is valid shell
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Installer is executable in the index
        if: runner.os != 'Windows'
        # The README tells people to run `./install.sh`. Committed from Windows, the file
        # arrives mode 100644 and that instruction fails for everyone who clones — while
        # every other check stays green, because nothing else runs it that way. Checked
        # against the git INDEX rather than the working tree so it is meaningful on any OS.
        run: |
          mode="$(git ls-files -s install.sh | cut -d' ' -f1)"
          test "$mode" = "100755" || { echo "install.sh is mode $mode; needs 100755 (git update-index --chmod=+x install.sh)"; exit 1; }
      - name: Installer works on a clean target, and rewrites the plugin root
        if: runner.os != 'Windows'
        run: |
          CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skilltest" ./install.sh
          # A bare skill has no plugin root. If this token survives into the installed copy,
          # every path in the skill body is broken and the skill fails at first use.
          test "$(grep -c 'CLAUDE_PLUGIN_ROOT' "$RUNNER_TEMP/skilltest/token-audit/SKILL.md")" = "0"
          test "$(grep -c 'CLAUDE_PLUGIN_ROOT' "$RUNNER_TEMP/skilltest/quiet-tests/SKILL.md")" = "0"
          test "$(grep -c 'CLAUDE_PLUGIN_ROOT' "$RUNNER_TEMP/skilltest/code-index/SKILL.md")" = "0"
          test "$(grep -c 'CLAUDE_PLUGIN_ROOT' "$RUNNER_TEMP/skilltest/code-map/SKILL.md")" = "0"
      - name: No dependencies, and none can be added by accident
        run: node -e "const p=require('./package.json');if(p.dependencies||p.devDependencies)throw new Error('a dependency was added — that changes what installing this costs a stranger')"
